<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DEATHRIGGER</title>
<style>
  body {
    background: #1a120b;
    color: #e8d9b5;
    font-family: 'Courier New', monospace;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px 16px 40px;
    margin: 0;
  }
  .frame {
    width: 100%;
    max-width: 520px;
    border: 2px solid #7a5230;
    background: #241a10;
  }
  .titlebar {
    padding: 14px 16px;
    border-bottom: 2px solid #7a5230;
  }
  .titlebar h1 {
    font-size: 18px;
    letter-spacing: 3px;
    margin: 0;
    color: #c94b2c;
  }
  .body-area { padding: 18px 16px; }
  .prompt-line {
    font-size: 13px;
    color: #a8916b;
    margin-bottom: 14px;
  }
  .input-row {
    display: flex;
    gap: 8px;
    margin-bottom: 6px;
  }
  input[type="text"] {
    flex: 1;
    background: #100b06;
    border: 1px solid #7a5230;
    color: #e8d9b5;
    font-family: inherit;
    font-size: 15px;
    padding: 10px 12px;
  }
  button {
    background: #7a5230;
    color: #e8d9b5;
    border: 1px solid #c94b2c;
    font-family: inherit;
    font-size: 13px;
    padding: 0 16px;
  }
  .status {
    min-height: 18px;
    font-size: 12px;
    margin-bottom: 18px;
  }
  .status.err { color: #c94b2c; }
  .status.ok { color: #7aa25c; }
  .entry {
    border-left: 3px solid #c94b2c;
    padding: 8px 12px;
    background: rgba(201,75,44,0.05);
    margin-bottom: 14px;
  }
  .entry .tag {
    font-size: 10px;
    color: #a8916b;
    margin-bottom: 6px;
  }
  .entry .dialogue {
    font-size: 14px;
    line-height: 1.6;
    white-space: pre-wrap;
  }
  .empty {
    color: #a8916b;
    font-size: 12px;
    text-align: center;
    padding: 20px 0;
  }
</style>
</head>
<body>
  <div class="frame">
    <div class="titlebar">
      <h1>DEATHRIGGER.</h1>
    </div>
    <div class="body-area">
      <div class="prompt-line">
        nos diga o que você sabe.<br>
        <span style="font-size: 11px; opacity: 0.7;">(digite em minúsculo — se a senha tiver mais de uma palavra, separe com espaço normalmente)</span>
      </div>
      <div class="input-row">
        <input type="text" id="pw" placeholder="senha...">
        <button id="go">INSERIR</button>
      </div>
      <div class="status" id="status"></div>
      <div class="log" id="log"></div>
      <div class="empty" id="empty">nenhum registro revelado ainda</div>
    </div>
  </div>

<script>
const ENTRIES = {
  "velho sal": { tag: "I REGRET NOTHING", text: "EU NÃO ME ARREPENDO DE NADA." },
  "forasteiro": { tag: "REGISTRO 000", text: "Ah, sim. é o que o bando dos doze são. forasteiros." },
  "deathrigger": { tag: "REGISTRO ???", text: ". . ." },
  "gatilho": { tag: "REGISTRO LEVIATHAN", text: "essas coisas nunca foram do nosso mundo. rituais? despertares? magia negra, tudo é magia negra. satanael deve ter envolvimento nisso." },
  "poeira": { tag: "REGISTRO 001", text: "O vento levanta mais do que deveria aqui. Levanta coisas que já foram enterradas duas vezes." },
  "sino": { tag: "REGISTRO 002", text: "Bate sozinho, de tempos em tempos. Ninguém teve coragem de subir e checar a corda." },
  "xerife": { tag: "REGISTRO 003", text: "Guarda as chaves da cadeia velha debaixo do colchão agora. Não confia nas fechaduras." },
  "1872": { tag: "REGISTRO 004", text: "Doze nomes somem do livro-caixa da cidade naquele inverno. Ninguém procura a razão por trás dos números." },
  "vinte e cinco anos": { tag: "REGISTRO 005", text: "A conta bate certinha, ano após ano, geração após geração. Só ninguém nunca parou pra somar." },
  "sobrevivente": { tag: "REGISTRO 006", text: "Voltou de 1872 sem contar uma palavra sequer. Envelheceu vinte anos numa única noite." },
  "doze": { tag: "REGISTRO 007", text: "Sempre falta uma cadeira na mesa. Sempre sobra um prato lavado que ninguém usou." },
  "chamado": { tag: "REGISTRO 008", text: "Algo dentro de cada um deles já tinha respondido, muito antes de qualquer chamado chegar." },
  "escolhidos": { tag: "REGISTRO 009", text: "Escolhidos carregam um peso que dorme junto com eles todas as noites." },
  "causa": { tag: "REGISTRO ???", text: "O pavio já estava dentro de cada um deles desde o nascimento. Só precisava de fósforo." },
  "ritual": { tag: "REGISTRO ???", text: "Alguns rituais não têm cerimônia. Só têm doze corações batendo no mesmo compasso, sem saber por quê." },
  "receptaculo": { tag: "REGISTRO ???", text: "O nome fica em branco no registro. O corpo, esse, sempre aparece — só a alma que falta contar." },
  "sacrificio": { tag: "REGISTRO ???", text: "O Sal aceita uma moeda só: sangue que ainda acredita que tem escolha." },
  "satanael": { tag: "REGISTRO ???", text: "Assiste de longe, dizem. Ou talvez esteja sentado bem ali, na mesa, contando os doze pratos." },
  "clint": { tag: "REGISTRO 010", text: "Levanta tijolo por tijolo, sozinho se precisar. A cidade nem sabe o nome de quem tenta salvá-la." },
  "canis": { tag: "REGISTRO 011", text: "Corre sem olhar pra trás desde aquela noite. O que ele carrega pesa mais do que qualquer perseguição." },
  "ish": { tag: "REGISTRO 012", text: "Usava uma coroa que ninguém lhe deu. Aprendeu, com muito sangue, a segurar as próprias mãos." },
  "maeron": { tag: "REGISTRO 013", text: "Conta moedas enquanto sonha com luzes de picadeiro. Sempre um golpe longe de voltar pra casa." },
  "icaro": { tag: "REGISTRO 014", text: "Carrega o nome da avó como escudo. A lei que ele quebra é a mesma que sonha em vestir um dia." },
  "cristine": { tag: "REGISTRO 015", text: "Sabe onde a mãe está enterrada. Não descansa até saber quem cavou a cova." },
  "damiao": { tag: "REGISTRO 016", text: "Voou léguas atrás de um irmão. Encontrou. Agora as asas não sabem mais pra onde apontar." },
  "elvis": { tag: "REGISTRO 017", text: "Perdeu a filha e o posto no mesmo papel assinado. Ainda usa a estrela por dentro do casaco, escondida." },
  "gloria": { tag: "REGISTRO 018", text: "POR FAVOR, NÃO, ME DEIXE EM PAZ!" },
  "east": { tag: "REGISTRO 019", text: "Vai uma gelada?" },
  "thomas": { tag: "REGISTRO 020", text: "Pouco cérebro, muita força. nada interessante." },
  "cartografo": { tag: "REGISTRO 021", text: "Eu." },
  "corisco": { tag: "REGISTRO 022", text: "Prestes a vir." },
  "mandibula": { tag: "REGISTRO 023", text: "Coração grande, cérebro menor que o do irmão." },
  "picuma": { tag: "REGISTRO 024", text: "Traidor." },
  "gideon": { tag: "REGISTRO 025", text: "Ingênuo." },
  "finn": { tag: "REGISTRO 026", text: "Morrerá logo logo." },
  "dalko": { tag: "REGISTRO 027", text: "REPUGNANTE." },
  "hiena": { tag: "REGISTRO ???", text: "Seu nome é Trixie. nunca existiu de verdade. mas eu nunca soube como o dalko conseguiu fazer aquilo.." },
  "guardas": { tag: "REGISTRO 028", text: "Ocupados." },
  "silas": { tag: "REGISTRO 029", text: "Idiota, pelo visto morreu." },
  "edgar": { tag: "REGISTRO 030", text: "O Sussurro esconde coisas que nenhum humano é capaz de ver." },
  "ariete": { tag: "REGISTRO 031", text: "Ele ainda usa esse nome?" }
};

const pwInput = document.getElementById('pw');
const goBtn = document.getElementById('go');
const statusEl = document.getElementById('status');
const logEl = document.getElementById('log');
const emptyEl = document.getElementById('empty');
let unlocked = [];

function render() {
  logEl.innerHTML = "";
  if (unlocked.length === 0) { emptyEl.style.display = "block"; return; }
  emptyEl.style.display = "none";
  unlocked.forEach(key => {
    const d = ENTRIES[key];
    if (!d) return;
    const div = document.createElement('div');
    div.className = 'entry';
    div.innerHTML = `<div class="tag">${d.tag}</div><div class="dialogue">${d.text}</div>`;
    logEl.appendChild(div);
  });
}

function tryUnlock() {
  const raw = pwInput.value.trim().toLowerCase();
  if (!raw) return;
  if (unlocked.includes(raw)) {
    statusEl.textContent = "JÁ REVELADO";
    statusEl.className = "status ok";
    return;
  }
  if (ENTRIES[raw]) {
    unlocked.push(raw);
    statusEl.textContent = "perfeito.";
    statusEl.className = "status ok";
    render();
    pwInput.value = "";
  } else {
    statusEl.textContent = "não encontrei nada em meus registros.";
    statusEl.className = "status err";
  }
}

goBtn.addEventListener('click', tryUnlock);
pwInput.addEventListener('keydown', e => { if (e.key === 'Enter') tryUnlock(); });
render();
</script>
</body>
</html>
